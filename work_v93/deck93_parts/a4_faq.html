<div class="slide lt" id="a4_faq" data-tipo="appendice">
  <div class="z" style="top:44px;width:1140px">
    <h2 class="sm">Le sei domande che arrivano sempre.</h2>
  </div>

  <svg width="1152" height="430" viewBox="0 0 1152 430"
       style="position:absolute;left:64px;top:132px" role="img" aria-labelledby="a4t a4d">
    <title id="a4t">Sei domande commerciali e sei risposte</title>
    <desc id="a4d">Tempi dei primi risultati, fermo linea, macchine di marche diverse,
      contenuto dell&rsquo;avvio, passaggio dal pilot alla scala, dati mancanti. Le domande
      su residenza dei dati e integrazione con il gestionale sono nel dossier tecnico.</desc>

    <g font-family="Geist" font-size="17" font-weight="650" fill="#0A0A0A">
      <text x="0" y="24">Quanto tempo serve per i primi risultati?</text>
      <text x="0" y="94">Serve fermare la linea per partire?</text>
      <text x="0" y="164">Funziona su macchine di marche diverse?</text>
      <text x="0" y="234">Che cosa comprende l&#8217;avvio?</text>
      <text x="0" y="304">Come si passa dal pilot alla scala?</text>
      <text x="0" y="374">Che cosa succede se mancano dei dati?</text>
    </g>
    <g font-family="Geist" font-size="15.5" fill="rgba(10,10,10,.66)">
      <text x="496" y="24">Il pilot produce una baseline e le prime cause ordinate per impatto.</text>
      <text x="496" y="48">La durata viene fissata in perimetrazione, sui dati disponibili.</text>

      <text x="496" y="94">La configurazione standard privilegia l&#8217;acquisizione in sola lettura.</text>
      <text x="496" y="118">Eventuali scambi ulteriori si definiscono nel solution design.</text>

      <text x="496" y="164">La compatibilit&#224; viene verificata sull&#8217;impianto reale, durante</text>
      <text x="496" y="188">l&#8217;audit tecnico.</text>

      <text x="496" y="234">Assessment, setup, integrazione e configurazione di KPI e formule.</text>
      <text x="496" y="258">Che cosa &egrave; compreso &egrave; indicato nella proposta economica.</text>

      <text x="496" y="304">Il pilot chiude con risultati, gap e proposta di estensione:</text>
      <text x="496" y="328">la scala si decide sui risultati.</text>

      <text x="496" y="374">Si parte da quello che c&#8217;&egrave;. Dove il dato manca, il progetto pu&#242;</text>
      <text x="496" y="398">prevedere contatori o sensori aggiuntivi.</text>
    </g>
