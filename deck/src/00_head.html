<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>D.Factory · Sales Deck</title>
<style>
/* ---------- FONTS (inlined base64 at build time, no CDN) ---------- */
@font-face{font-family:"Geist";src:url("@@FONT_SANS@@") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
@font-face{font-family:"Geist Mono";src:url("@@FONT_MONO@@") format("woff2");font-weight:100 900;font-style:normal;font-display:block}

/* ---------- BRAND TOKENS · D.FACTORY ---------- */
:root{
  --acid:#e6e011;          /* accento unico */
  --ink:#000000;           /* testo display */
  --body:#101114;          /* testo corrente */
  --muted:#5f636a;         /* secondario */
  --faint:#9aa0a7;         /* label / meta */
  --paper:#fafafb;         /* base near-white freddo */
  --fill:#f1f2f4;          /* riempimento tenue */
  --line:rgba(0,0,0,.13);
  --line2:rgba(0,0,0,.24);
  --dark:#0b0b0c;          /* full-bleed scuro */
  --dline:rgba(255,255,255,.15);
  --dline2:rgba(255,255,255,.28);
  --dbody:#e7e8ea;
  --dmuted:#a2a6ad;
  --dfaint:#6d7178;
  --panel:#0c0c0e;         /* mockup prodotto */
  --panel2:#0a0a0b;
  --pline:#1c1d21;
  --ptext:#c9ccd1;
  --pmuted:#878b93;
  --pfaint:#5b5f66;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#54565b}
body{font-family:"Geist",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.deck{display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 0}

/* ---------- SLIDE ---------- */
.slide{position:relative;width:1280px;height:720px;background:var(--paper);color:var(--body);
  overflow:hidden;font-size:14px;flex:0 0 auto}
.slide.dark{background:var(--dark);color:var(--dbody)}
.slide.acid{background:var(--acid);color:#000}
.frame{position:absolute;left:30px;top:30px;right:30px;bottom:30px;border:1px solid var(--line);pointer-events:none}
.dark .frame{border-color:var(--dline)}
.acid .frame{border-color:rgba(0,0,0,.3)}

/* masthead */
.mh{position:absolute;left:77px;right:77px;top:62px;display:flex;align-items:center;justify-content:space-between}
.sec{font:500 9px/1 "Geist Mono",monospace;letter-spacing:.17em;text-transform:uppercase;color:var(--faint)}
.sec b{color:var(--body);font-weight:700;letter-spacing:.1em}
.dark .sec{color:var(--dfaint)}.dark .sec b{color:var(--dmuted)}
.acid .sec{color:rgba(0,0,0,.55)}.acid .sec b{color:#000}

/* logo: sfondi CSS, così ogni asset base64 compare una volta sola */
.lk-w{background-image:url("@@LOCK_W@@")}
.lk-b{background-image:url("@@LOCK_B@@")}
.lk-mw{background-image:url("@@MARK_W@@")}
.lk-mb{background-image:url("@@MARK_B@@")}
.lk-w,.lk-b,.lk-mw,.lk-mb{background-repeat:no-repeat;background-position:center;background-size:contain}
.lock{height:24px;width:70px;display:block;flex:0 0 70px}
.ft .badge .bm{height:13px;width:12px;display:block}
.dash .brandrow .bmd{height:10px;width:9.3px;display:block;flex:0 0 9.3px}

/* corpo */
.body{position:absolute;left:77px;right:77px;top:100px;bottom:82px}

/* cartiglio */
.ft{position:absolute;left:30px;right:30px;bottom:30px;height:33px;border-top:1px solid var(--line);
  display:flex;align-items:stretch;font:500 8.5px/1 "Geist Mono",monospace;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint)}
.dark .ft{border-color:var(--dline);color:var(--dfaint)}
.acid .ft{border-color:rgba(0,0,0,.3);color:rgba(0,0,0,.55)}
.ft .c{display:flex;align-items:center;padding:0 13px;border-right:1px solid var(--line);white-space:nowrap}
.dark .ft .c{border-color:var(--dline)}
.acid .ft .c{border-color:rgba(0,0,0,.3)}
.ft .c.code{color:var(--body);font-weight:700}
.dark .ft .c.code{color:var(--dbody)}
.acid .ft .c.code{color:#000}
.ft .sp{flex:1}
.ft .tag{display:flex;align-items:center;padding:0 16px;letter-spacing:.14em;white-space:nowrap}
.ft .badge{width:70px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line)}
.dark .ft .badge{border-color:var(--dline)}
.acid .ft .badge{border-color:rgba(0,0,0,.3)}
.ft .badge img{height:13px;display:block}

/* ---------- TIPOGRAFIA ---------- */
.t-xl{font-weight:700;font-size:54px;line-height:1.03;letter-spacing:-.034em;color:var(--ink)}
.t-lg{font-weight:700;font-size:42px;line-height:1.06;letter-spacing:-.032em;color:var(--ink)}
.t-md{font-weight:700;font-size:33px;line-height:1.1;letter-spacing:-.028em;color:var(--ink)}
.dark .t-xl,.dark .t-lg,.dark .t-md{color:#f5f6f7}
.lede{font-size:14.5px;line-height:1.62;color:#3b3e44;font-weight:400}
.dark .lede{color:var(--dmuted)}
.acid .lede{color:rgba(0,0,0,.78)}
.lede b{font-weight:600;color:var(--body)}
.dark .lede b{color:#f0f1f2}
.acid .lede b{color:#000}
.kick{font:500 9.5px/1 "Geist Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.dark .kick{color:var(--dfaint)}
.acid .kick{color:rgba(0,0,0,.6)}
.mono{font-family:"Geist Mono",monospace}
.lab{font:500 8.5px/1.3 "Geist Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dark .lab{color:var(--dfaint)}
.acid .lab{color:rgba(0,0,0,.6)}
.lab.ink{color:var(--body)}
.dark .lab.ink{color:var(--dmuted)}
.foot{font:400 8.5px/1.5 "Geist Mono",monospace;letter-spacing:.06em;color:#b0b5bb}
.dark .foot{color:#5e626a}
.acid .foot{color:rgba(0,0,0,.45)}

/* evidenza: su chiaro il giallo è FONDO (testo nero), mai testo giallo */
.hl{background:var(--acid);color:#000;padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* su scuro il giallo può essere testo */
.dark .em{color:var(--acid)}
.acid .em{border-bottom:3px solid #000;padding-bottom:1px}
.rule-acid{width:34px;height:3px;background:var(--acid)}
.note{border-left:2px solid var(--acid);padding-left:12px}

/* ---------- CELLE / CARD ---------- */
.cells{display:grid;border:1px solid var(--line2)}
.dark .cells{border-color:var(--dline2)}
.acid .cells{border-color:rgba(0,0,0,.5)}
.cells>*{padding:17px 19px;border-left:1px solid var(--line);min-width:0}
.cells>*:first-child{border-left:0}
.dark .cells>*{border-color:var(--dline)}
.acid .cells>*{border-color:rgba(0,0,0,.3)}
.cells.rows>*{border-left:0;border-top:1px solid var(--line)}
.cells.rows>*:first-child{border-top:0}
.ttl{font-weight:600;font-size:14.5px;letter-spacing:-.012em;color:var(--ink);margin-bottom:6px}
.dark .ttl{color:#f0f1f2}
.txt{font-size:12.5px;line-height:1.52;color:var(--muted)}
.dark .txt{color:var(--dmuted)}
.acid .txt{color:rgba(0,0,0,.72)}
.txt b{font-weight:600;color:var(--body)}
.dark .txt b{color:#eceded}
.cap{position:absolute;left:19px;right:19px;bottom:15px}
.bar{height:3px;background:var(--ink)}
.bar.acid-bar{background:var(--acid)}
.bar.soft{background:var(--line2)}

/* pill / chip */
.chip{display:inline-flex;align-items:center;font:500 8.5px/1 "Geist Mono",monospace;letter-spacing:.1em;
  text-transform:uppercase;padding:4px 7px;border:1px solid var(--line2);color:var(--muted);border-radius:2px}
.chip.on{background:var(--acid);border-color:var(--acid);color:#000;font-weight:700}
.chip.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.dark .chip{border-color:var(--dline2);color:var(--dmuted)}
.ph{display:inline-flex;align-items:center;gap:5px;font:500 8.5px/1 "Geist Mono",monospace;letter-spacing:.08em;
  padding:4px 8px;border:1px dashed var(--line2);color:var(--muted);border-radius:2px}
.ph::before{content:"";width:5px;height:5px;background:var(--acid);flex:0 0 5px}
.dark .ph{border-color:var(--dline2);color:var(--dmuted)}
/* placeholder aperto: informazione che il committente deve ancora fornire.
   Deve restare visibile e riconoscibile, mai riempita con dati dedotti. */
.ph.ph-open{border-style:dashed;border-width:1px;border-color:var(--line2);
  background:repeating-linear-gradient(135deg,transparent,transparent 5px,rgba(230,224,17,.13) 5px,rgba(230,224,17,.13) 10px)}
.dark .ph.ph-open{border-color:var(--dline2);
  background:repeating-linear-gradient(135deg,transparent,transparent 5px,rgba(230,224,17,.16) 5px,rgba(230,224,17,.16) 10px)}
.ph-block{border:1px dashed var(--line2);padding:16px 18px;position:relative;
  background:repeating-linear-gradient(135deg,transparent,transparent 7px,rgba(230,224,17,.09) 7px,rgba(230,224,17,.09) 14px)}
.ph-block .ph-what{font:500 8.5px/1.5 "Geist Mono",monospace;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted)}
.ph-block .ph-need{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:8px}

/* stat */
.stats{display:grid;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0}
.dark .stats{border-color:var(--dline)}
.stat .n{font-weight:700;font-size:46px;line-height:1;letter-spacing:-.035em;color:var(--ink)}
.dark .stat .n{color:#f5f6f7}
.stat .n small{font-size:26px;font-weight:600}
.stat .l{margin-top:9px;font:500 8.5px/1.3 "Geist Mono",monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.dark .stat .l{color:var(--dfaint)}
.stat .u{margin-top:8px;height:3px;background:var(--acid);width:38px}

/* tabella cosa ottieni */
.kv{border:1px solid var(--line2)}
.kv .r{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 15px;border-top:1px solid var(--line)}
.kv .r:first-child{border-top:0}
.kv .k{font-size:13px;color:var(--body)}
.kv .v{font:600 8.5px/1 "Geist Mono",monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);text-align:right}
.kv .v em{font-style:normal;background:var(--acid);color:#000;padding:2px 4px}

/* matrice competitiva */
.mx{width:100%;border-collapse:collapse;font-size:11.5px}
.mx th{font:500 8px/1.3 "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  font-weight:500;text-align:center;padding:0 6px 9px;vertical-align:bottom}
.mx th.us{color:var(--ink);font-weight:700}
.mx th.rowh,.mx td.rowh{text-align:left;font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.02em;
  color:var(--muted);padding-left:0;width:300px;line-height:1.35}
.mx td.rowh b{color:var(--ink);font-weight:700}
.mx td{text-align:center;padding:6px 6px;border-top:1px solid var(--line)}
.mx td.col-us{background:rgba(230,224,17,.16)}
.mx .d{display:inline-block;width:9px;height:9px;border-radius:50%}
.mx .full{background:var(--ink)}
.mx .part{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);border:1px solid var(--line2)}
.mx .none{background:transparent;border:1px solid var(--line2)}
.mx .full.u{background:var(--ink)}
.legend{display:flex;gap:18px;font:400 8.5px/1 "Geist Mono",monospace;letter-spacing:.09em;color:var(--faint);margin-top:11px}
.legend span{display:flex;align-items:center;gap:6px}

/* timeline attivazione */
.steps{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;position:relative}
.steps .s .n{font:500 8px/1 "Geist Mono",monospace;letter-spacing:.16em;color:var(--faint);margin-bottom:8px}
.steps .s .h{font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--ink);margin-bottom:7px}
.steps .s .d{font-size:11.5px;line-height:1.5;color:var(--muted);padding:0 12px}
.track{position:relative;height:1px;background:var(--line2);margin:16px 0 0}
.track .dot{position:absolute;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--acid);
  border:1px solid rgba(0,0,0,.35);transform:translateX(-50%)}
.owners{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;margin-top:14px}
.owners .o{display:flex;flex-direction:column;align-items:center;gap:7px}
.owners .t{font:400 8px/1 "Geist Mono",monospace;letter-spacing:.11em;color:var(--faint)}

/* ---------- MOCKUP PRODOTTO ---------- */
.dash{background:var(--panel);border:1px solid var(--pline);border-radius:5px;overflow:hidden;display:flex;
  color:var(--ptext);font-size:8px;box-shadow:0 20px 44px rgba(0,0,0,.20)}
.dash *{min-width:0}
.dash .side{width:100px;flex:0 0 100px;background:var(--panel2);border-right:1px solid var(--pline);
  padding:8px 0;display:flex;flex-direction:column;gap:1px}
.dash .brandrow{display:flex;align-items:center;gap:5px;padding:1px 9px 9px}
.dash .brandrow img{height:10px;display:block}
.dash .mod{font:700 5px/1 "Geist Mono",monospace;letter-spacing:.13em;padding:2px 4px;border:1px solid #2a2c32;
  color:var(--pmuted);border-radius:2px}
.dash .mod.y{border-color:var(--acid);color:var(--acid)}
.dash .grp{font:500 5.2px/1 "Geist Mono",monospace;letter-spacing:.17em;color:var(--pfaint);padding:9px 9px 4px}
.dash .it{font-size:7.2px;padding:3.4px 9px;color:var(--pmuted);display:flex;align-items:center;gap:5px;letter-spacing:.005em}
.dash .it::before{content:"";width:4px;height:4px;border:1px solid #33363c;flex:0 0 4px}
.dash .it.on{background:#16171b;color:#f1f2f3;box-shadow:inset 2px 0 0 var(--acid)}
.dash .it.on::before{background:var(--acid);border-color:var(--acid)}
.dash .side .grow{flex:1}
.dash .who{margin:0 7px;padding:6px;border:1px solid var(--pline);border-radius:3px;display:flex;align-items:center;gap:5px}
.dash .who .av{width:12px;height:12px;border-radius:2px;background:#1d1f24;flex:0 0 12px}
.dash .who .n{font-size:6.4px;color:var(--ptext);line-height:1.25}
.dash .who .n i{font-style:normal;display:block;font-size:5.4px;color:var(--pfaint);letter-spacing:.08em;
  font-family:"Geist Mono",monospace;text-transform:uppercase}
.dash .main{flex:1;display:flex;flex-direction:column}
.dash .top{height:27px;flex:0 0 27px;border-bottom:1px solid var(--pline);display:flex;align-items:center;
  padding:0 9px;gap:9px}
.dash .top .h{font-size:9px;font-weight:600;color:#f1f2f3;letter-spacing:-.01em;line-height:1.15}
.dash .top .h i{font-style:normal;display:block;font:400 5.2px/1.3 "Geist Mono",monospace;letter-spacing:.13em;
  color:var(--pfaint);text-transform:uppercase;margin-top:1.5px}
.dash .meta{display:flex;gap:7px}
.dash .meta .m{border-left:1px solid var(--pline);padding-left:7px}
.dash .meta .m .l{font:400 4.8px/1 "Geist Mono",monospace;letter-spacing:.14em;color:var(--pfaint);text-transform:uppercase}
.dash .meta .m .v{font:600 7px/1 "Geist Mono",monospace;color:#e9eaec;margin-top:2.5px}
.dash .tabs{margin-left:auto;display:flex;gap:3px;align-items:center}
.dash .tb{font:500 5px/1 "Geist Mono",monospace;letter-spacing:.1em;padding:3px 4px;border:1px solid #23252a;
  color:var(--pfaint);border-radius:2px}
.dash .tb.on{background:#1c1d22;color:#e9eaec;border-color:#33363c}
.dash .tb.live{border-color:var(--acid);color:var(--acid)}
.dash .tb.live::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--acid);margin-right:3px}
.dash .canvas{flex:1;display:flex;padding:8px;gap:8px}
.dash .col{display:flex;flex-direction:column;gap:8px;flex:1}
.dash .rail{width:132px;flex:0 0 132px;display:flex;flex-direction:column;gap:8px}
.dash .pan{border:1px solid var(--pline);border-radius:3px;padding:7px 8px;background:#0d0d10;display:flex;flex-direction:column}
.dash .pan.f{flex:1}
.dash .ph2{font:500 5.2px/1 "Geist Mono",monospace;letter-spacing:.15em;color:var(--pfaint);text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.dash .ph2 b{color:var(--pmuted);font-weight:500}
.dash .ph2 .y{color:var(--acid)}
.dash .big{font:600 17px/1 "Geist Mono",monospace;color:#f2f3f4;letter-spacing:-.02em}
.dash .big.y{color:var(--acid)}
.dash .big small{font-size:8px;font-weight:500;color:var(--pmuted);letter-spacing:.04em}
.dash .sub{font:400 5.2px/1.4 "Geist Mono",monospace;letter-spacing:.09em;color:var(--pfaint);margin-top:4px;text-transform:uppercase}
.dash .kvr{display:flex;justify-content:space-between;gap:9px;font-size:6.6px;color:var(--pmuted);padding:2px 0}
.dash .rowset{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
.dash .rowset .tl{height:9px}
.dash .kvr b{color:#e6e7e9;font-weight:600;font-family:"Geist Mono",monospace}
.dash .prog{height:3px;background:#191a1e;border-radius:2px;overflow:hidden;margin-top:5px}
.dash .prog i{display:block;height:100%;background:var(--acid)}
/* barre stato */
.dash .row{display:flex;align-items:center;gap:5px;margin-bottom:2.5px}
.dash .row .nm{width:64px;flex:0 0 64px;font:400 5.4px/1 "Geist Mono",monospace;color:var(--pmuted);
  text-align:right;letter-spacing:.02em;overflow:hidden;white-space:nowrap}
.dash .tl{flex:1;height:6px;display:flex;gap:0;border-radius:1px;overflow:hidden;background:#141519}
.dash .tl i{display:block;height:100%}
.s-run{background:var(--acid)}
.s-idle{background:#3a3d44}
.s-held{background:#6e727a}
.s-stop{background:#f2f3f4}
.s-set{background:#25272c}
.dash .lg{display:flex;gap:9px;margin-top:6px;font:400 5px/1 "Geist Mono",monospace;letter-spacing:.1em;
  color:var(--pfaint);text-transform:uppercase;flex-wrap:wrap}
.dash .lg span{display:flex;align-items:center;gap:3px}
.dash .lg i{width:5px;height:5px;display:block}
/* machine cards */
.dash .mach{display:flex;gap:4px}
.dash .mc{flex:1;border:1px solid var(--pline);border-radius:2px;padding:4px;background:#0d0d10;
  display:flex;flex-direction:column;gap:3px;position:relative}
.dash .mc .st{display:flex;justify-content:space-between;align-items:center;font:500 4.6px/1 "Geist Mono",monospace;
  letter-spacing:.1em;color:var(--pfaint)}
.dash .mc .st i{width:4px;height:4px;border-radius:50%;background:var(--acid);display:block}
.dash .mc .ic{height:12px;margin:1px 0;display:flex;align-items:flex-end;gap:1.5px;padding-bottom:1px;
  border-bottom:1px solid #22242a}
.dash .mc .ic i{flex:1;display:block;background:#23252b}
.dash .mc .ic i:nth-child(1){height:52%}
.dash .mc .ic i:nth-child(2){height:88%}
.dash .mc .ic i:nth-child(3){height:66%}
.dash .mc.alert .ic i:nth-child(2){background:var(--acid)}
.dash .mc .nm2{font-size:6px;font-weight:600;color:#e9eaec;line-height:1.2}
.dash .mc .vv{font:400 5px/1 "Geist Mono",monospace;color:var(--pfaint);letter-spacing:.06em}
.dash .mc.alert{border-color:var(--acid)}
.dash .mc.alert .st i{background:#f2f3f4}
/* svg chart helpers */
.dash svg{display:block;width:100%}
.dash .axl{font:400 4.6px "Geist Mono",monospace;fill:var(--pfaint);letter-spacing:.06em}
</style>
</head>
<body>
<div class="deck">
